name: CI/CD Pipeline - Clothes4Happiness

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout do Código
        uses: actions/checkout@v3

      - name: 2. Configurar ambiente Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 3. Instalar Dependências do Sistema
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 4. Executar Testes Automatizados (CI)
        run: |
          python manage.py test

      - name: 5. Build da Imagem Docker da Clothes4Happiness (CD)
        run: |
          docker build -t clothes4happiness-app .